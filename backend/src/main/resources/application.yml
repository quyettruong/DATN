server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: ${DB_URL:jdbc:sqlserver://127.0.0.1:14333;databaseName=benhvien;encrypt=true;trustServerCertificate=true}
    driver-class-name: ${DB_DRIVER:com.microsoft.sqlserver.jdbc.SQLServerDriver}
    username: ${DB_USERNAME:hospital_user}
    password: ${DB_PASSWORD:Hospital@123}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.SQLServerDialect
        default_batch_fetch_size: 30
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
  h2:
    console:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET:hospital-flow-system-secret-key-that-is-at-least-256-bits-long-for-hs256}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  queue:
    mode: ${QUEUE_MODE:PRIORITY}
  ai:
    service-url: ${AI_SERVICE_URL:http://127.0.0.1:8000}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
